[package]
name = "radial-settings"
description = "The settings window (egui)."
version.workspace = true
edition.workspace = true
publish.workspace = true

[lints]
workspace = true

[dependencies]
# Glow instead of the default wgpu renderer (open decision 3): lighter and faster to build,
# and the settings window draws no 3D.
eframe = { version = "0.37.0", default-features = false, features = ["default_fonts", "glow"] }
radial-domain = { version = "0.1.0", path = "../domain" }
